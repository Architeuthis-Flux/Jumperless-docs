site_url: "https://docs.jumperless.org"

site_name: Jumperless Docs
site_description: "Learn how to use your Jumperless"

# Files and directories to exclude from documentation
exclude_docs: |
  drafts/
  temp/
  *.tmp
  *.bak
  *~
  .DS_Store
  _*

# Built, but not listed in the left nav
not_in_nav: |
  findme.md

# Navigation structure - explicitly define what appears in the sidebar
nav:
  - Home: index.md
  - Basic Controls: 01-basic-controls.md
  - The App: 03-app.md
  - OLED Support: 04-oled.md
  - Arduino Stuff: 05-arduino.md
  - Config File: 06-config.md
  - Debug Views: 07-debugging.md
  - Automation & LLM Tools: 07.5-automation.md
  - File Manager: 08-file-manager.md
  - MicroPython: 08-micropython.md
  - MicroPython API Reference: 09.5-micropythonAPIreference.md
  - Odds and Ends: 09.8-odds-and-ends.md
  - 3D Printable Stand: 10-3d-stand.md

  - Temporal Badge:
    - Developer Guide: badge-developer-guide.md
    - API Reference: badge-api-reference.md
  - Glossary of Terms: 99-glossary.md
  - Shop: https://shop.jumperless.org
  - JumperIDE: https://ide.jumperless.org/

# 
# theme_dir: 'custom_theme'

theme:
  name: readthedocs
  logo: assets/JNameLogo.png
  custom_dir: custom_theme/

# plugins:
#   - social:
#       cards_layout_options:
#         logo: assets/ColorJumpLogoNameUnhuged.png
# plugins:
#   - mkdocs-video
      # is_video: True
      # video_muted: True
      # video_controls: True
      # css_style:
      #   width: "100%"
extra_css: [extra.css, overrides.css]

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - mermaid-init.js
  - embed/find-me-dock.js
  - embed/stl-viewer.js

# Markdown extensions for custom syntax highlighting
markdown_extensions:
  # Heading IDs = text before '(' only (e.g. gpio_set, connect) so JumperIDE and links can target #gpio_set
  - markdown.extensions.toc:
      slugify: !!python/name:slugify_headings.slugify_name_only
  - pymdownx.highlight:
      use_pygments: true
      pygments_lang_class: true
      pygments_style: jumperless
      auto_title: false
      linenums: true
      linenums_style: pymdownx-inline
      guess_lang: false
      default_lang: jython
      # css_class: "codehilite"
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite:
      style_plain_text: jython

# Hooks to register custom lexers and generate llms.txt / scripts index
hooks:
  - docs/hooks.py
  - docs/generate_llms_txt.py
  - docs/generate_scripts_index.py

extra:
  meta:
    - name: color-scheme
      content: dark
    - name: darkreader-lock

